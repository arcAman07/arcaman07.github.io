<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Metaprogramming for coding agents</title>
  <desc id="desc">A coding agent builds reusable Python helpers to solve tasks in an unfamiliar language.</desc>
  <rect width="400" height="320" fill="#faf8f4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="38" font-size="16" fill="#666">METAPROGRAMMING</text>
    <rect x="64" y="58" width="272" height="54" rx="8" fill="#fff" stroke="#d5cdc1"/>
    <text x="200" y="91" font-size="20" fill="#222">Coding agent</text>
    <path d="M200 112v26m-6-7 6 7 6-7" fill="none" stroke="#b35900" stroke-width="3"/>
    <rect x="64" y="142" width="272" height="54" rx="8" fill="#fff0de" stroke="#dfac70"/>
    <text x="200" y="175" font-size="20" fill="#803e00">Reusable Python helpers</text>
    <path d="M200 196v26m-6-7 6 7 6-7" fill="none" stroke="#b35900" stroke-width="3"/>
    <rect x="64" y="226" width="272" height="54" rx="8" fill="#fff" stroke="#d5cdc1"/>
    <text x="200" y="259" font-size="20" fill="#222">Unfamiliar language</text>
  </g>
</svg>
